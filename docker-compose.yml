# docker-compose.yml
version: '3.8'

services:
  # ============================================
  # REDIS
  # ============================================
  redis:
    image: redis:alpine
    container_name: monitoreo_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - monitoreo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # BASE DE DATOS
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: monitoreo_db
    environment:
      - POSTGRES_DB=${DB_NAME:-monitoreo_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - monitoreo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-monitoreo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # DJANGO WEB
  # ============================================
  web:
    build: .
    container_name: monitoreo_web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=monitoreo_proyecto.settings
      - DB_NAME=${DB_NAME:-monitoreo_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-clave-por-defecto}
      - DEBUG=${DEBUG:-1}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - DOCKER_ENV=1
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitoreo_network

  # ============================================
  # CELERY WORKER
  # ============================================
  celery_worker:
    build: .
    container_name: monitoreo_celery_worker
    command: celery -A monitoreo_proyecto worker --loglevel=info --concurrency=4
    environment:
      - DJANGO_SETTINGS_MODULE=monitoreo_proyecto.settings
      - DB_NAME=${DB_NAME:-monitoreo_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-clave-por-defecto}
      - DEBUG=${DEBUG:-1}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - DOCKER_ENV=1
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitoreo_network

  # ============================================
  # CELERY BEAT
  # ============================================
  celery_beat:
    build: .
    container_name: monitoreo_celery_beat
    command: celery -A monitoreo_proyecto beat --loglevel=info
    environment:
      - DJANGO_SETTINGS_MODULE=monitoreo_proyecto.settings
      - DB_NAME=${DB_NAME:-monitoreo_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-clave-por-defecto}
      - DEBUG=${DEBUG:-1}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - DOCKER_ENV=1
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitoreo_network

volumes:
  postgres_data:
  static_volume:

networks:
  monitoreo_network:
    driver: bridge