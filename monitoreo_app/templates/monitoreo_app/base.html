<!-- monitoreo_app/templates/monitoreo_app/base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos personalizados -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'monitoreo_app/css/styles.css' %}">
    
    <style>
        /* Estilos adicionales específicos del template si son necesarios */
    </style>
</head>

<body class="min-h-screen flex flex-col">
    <!-- ============================================ -->
    <!-- NAVBAR -->
    <!-- ============================================ -->
    <nav class="glass-panel p-4 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-400">
                <i class="fa-solid fa-network-wired mr-2"></i> Centro de Monitoreo
            </h1>
            <div class="flex items-center gap-6">
                <a href="/" class="text-gray-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-gauge-high mr-1"></i> Dashboard
                </a>
                <a href="/alerts/" class="text-gray-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-bell mr-1"></i> Alertas
                </a>
                <a href="/settings/" class="text-gray-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-sliders mr-1"></i> Ajustes
                </a>
                <span class="text-sm text-gray-400">
                    Estado: <span class="text-green-400 font-bold">Activo</span>
                </span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto flex-grow p-6">
        {% block content %}{% endblock %}
    </main>

    <!-- ============================================ -->
    <!-- LIBRERÍAS JS -->
    <!-- ============================================ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Scripts específicos de cada página -->
    {% block scripts %}{% endblock %}
</body>
</html>
