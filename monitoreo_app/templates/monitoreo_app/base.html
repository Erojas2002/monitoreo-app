<!-- monitoreo_app/templates/monitoreo_app/base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMS Ligero - Portafolio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">
    <!-- ============================================ -->
    <!-- NAVBAR -->
    <!-- ============================================ -->
    <nav class="glass-panel p-4 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-400">
                <i class="fa-solid fa-network-wired mr-2"></i> Centro de Monitoreo
            </h1>
            <div class="flex items-center gap-6">
                <a href="/" class="text-gray-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-gauge-high mr-1"></i> Dashboard
                </a>
                <a href="/alerts/" class="text-gray-300 hover:text-white transition-colors">
                    <i class="fa-solid fa-bell mr-1"></i> Alertas
                </a>
                <span class="text-sm text-gray-400">
                    Estado: <span class="text-green-400 font-bold">Activo</span>
                </span>
            </div>
        </div>
    </nav>

    <!-- ============================================ -->
    <!-- CONTENIDO PRINCIPAL -->
    <!-- ============================================ -->
    <main class="container mx-auto flex-grow p-6">
        {% block content %}{% endblock %}
    </main>

    <!-- ============================================ -->
    <!-- LIBRERÍAS JS -->
    <!-- ============================================ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
